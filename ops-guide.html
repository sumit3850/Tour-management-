<style>
:root{--ink:#1b2a4a;--soft:#5a6a86;--forest:#143a2e;--blue:#0a6ed1;--paper:#eef1f6;--surface:#fff;--line:#e2e8f1;--ok:#1b7a4d;--err:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;padding:18px}
.wrap{max-width:640px;margin:0 auto}
.head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 20px 12px;text-align:center;margin-bottom:14px}
.head img{max-width:180px;max-height:64px;object-fit:contain;display:block;margin:0 auto}
.head .brand{font-family:'Calistoga',serif;font-size:20px}.head .brand .ex{color:#1976d2}
.head h1{font-size:14px;font-weight:600;margin-top:6px;color:var(--soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px -14px rgba(20,40,80,.2)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.top .head-l{flex:1}
.top b{font-size:15px}
.head-l{min-width:0}
.code{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:#e7f1fb;border-radius:6px;padding:1px 8px;margin-bottom:4px}
.name{font-size:15px;font-weight:700;line-height:1.3}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.code-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}.code-row .code{margin-bottom:0}
.fee-row{display:flex;justify-content:space-between;align-items:center;background:#e4f3ea;color:var(--ok);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin:0 0 12px}.fee-row b{font-size:15px;font-weight:800}
.back-btn{width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--soft);font-weight:700;font-size:12.5px;cursor:pointer}
.fee{font-size:13px;font-weight:700;color:var(--ok);background:#e4f3ea;border-radius:8px;padding:3px 10px;white-space:nowrap}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:#e7f1fb;color:var(--blue);white-space:nowrap}
.pill.warn{background:#fbe7e4;color:var(--err)}
.pill.ok{background:#e4f3ea;color:var(--ok)}
.dates{font-size:13px;color:var(--soft);margin-top:2px}
.rows{display:grid;grid-template-columns:minmax(96px,max-content) 8px minmax(0,1fr);gap:7px 6px;font-size:13px;line-height:1.45;align-items:start}
.rows span.k{color:var(--soft);font-weight:500;white-space:nowrap;padding-right:6px}.rows span.c{color:var(--soft)}.rows span.v{font-weight:500;text-align:left;min-width:0;overflow-wrap:break-word}
.remarks{margin-top:10px;padding:10px 12px;background:var(--paper);border-radius:10px;font-size:13px}
.pay{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;font-size:12px}
.pay-h{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--paper);font-weight:700;color:var(--forest);font-size:12px}
.pay-r{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.pay-l{min-width:0}.pay-l b{font-size:12.5px}.pay-l .code{font-size:11px;padding:0 6px;margin-right:2px}
.pay-l small,.pay-a small{display:block;font-size:11px;color:var(--soft);font-weight:500;margin-top:2px}
.pay-a{text-align:right;font-weight:700;white-space:nowrap;color:var(--ink)}.pay-a small.ok{color:var(--ok)}.pay-a small.pend{color:#b8860b}
.sess{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.sess-h{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--paper);font-weight:700;color:var(--forest)}
.sess-r{display:grid;grid-template-columns:96px minmax(0,1fr) max-content;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:start}
.sess-r.noamt{grid-template-columns:96px minmax(0,1fr)}
.sess-r .d{font-weight:600;white-space:nowrap}.sess-r .d small,.sess-r .w small{display:block;font-size:11px;color:var(--soft);font-weight:500;white-space:normal}.sess-r .w{color:var(--ink);overflow-wrap:break-word}.sess-r .a{font-weight:700;color:var(--ok);white-space:nowrap}
.fb{margin-top:8px;padding:10px 12px;background:#fbe7e4;border-radius:10px;font-size:12.5px;color:var(--err)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts button{min-height:42px;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit}
.acts button.on{border-color:var(--blue);background:#e7f1fb;color:var(--blue)}
.reasonbox{display:none;margin-top:10px}
.reasonbox textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-height:70px}
.reasonbox button{margin-top:8px;width:100%;padding:11px;border:none;border-radius:10px;background:var(--forest);color:#fff;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--soft);padding:40px 20px;font-size:14px}
.err{background:#fbe7e4;color:var(--err);border:1px solid #f0c2bb;border-radius:12px;padding:14px;font-size:14px;margin-bottom:14px}
.ok-box{background:#e4f3ea;color:var(--ok);border:1px solid #b6e0c6;border-radius:12px;padding:14px;font-size:14px;margin-bottom:14px;display:none}
.foot{text-align:center;font-size:11px;color:var(--soft);padding:16px 0}
label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 5px}
input{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:11px}
.btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:var(--forest);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.pill.mid{background:#fff4e0;color:#b8860b}
.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto}
.tab{flex:0 0 auto;white-space:nowrap;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink)}
.tab.on{border-color:var(--blue);background:#e7f1fb;color:var(--blue)}
.logout-btn{position:absolute;top:16px;right:16px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--soft);cursor:pointer}
.head{position:relative}
.install-btn{width:100%;margin-top:10px;padding:11px;border:1px dashed var(--blue);border-radius:11px;background:#e7f1fb;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer}
/* ---- Sign-in: motion (spring-style entrance, focus glow, press scale, shake) ---- */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.head,#gate,#netbar,#okbox,#err{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
#gate{animation-delay:.08s}
#gate{padding:22px 20px 18px}
#gate .g-title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}
#gate .g-sub{font-size:13px;color:var(--soft);margin-bottom:6px}
#gate label{margin-top:14px}
#gate .g-field{position:relative}
#gate input{transition:border-color .18s,box-shadow .18s,transform .18s;background:#fff}
#gate input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,110,209,.14)}
#gate .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s cubic-bezier(.22,1,.36,1),box-shadow .2s,background .2s;box-shadow:0 10px 24px -12px rgba(20,58,46,.6)}
#gate .btn:active{transform:scale(.97)}
#gate .btn:disabled{opacity:.85;cursor:default}
#gate .btn .spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
#gate .btn.busy .spin{display:inline-block}
#gate .g-alt{display:flex;gap:8px;margin-top:10px}
#gate .g-alt button{flex:1;padding:11px 8px;border-radius:11px;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s}
#gate .g-alt button:active{transform:scale(.97)}
#gate .install-btn{margin-top:0}
#gate #offlineBtn{margin-top:0;padding:11px 8px;font-size:12.5px}
#gate .g-saved{display:none;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:11px;background:#e4f3ea;color:var(--ok);font-size:12.5px;font-weight:600}
#gate .g-saved .tick{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;animation:pop .5s cubic-bezier(.22,1,.36,1) both}
.err.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
/* ---- Operation card: "ops sheet" — header with countdown ring, 3-figure strip, tabs, status bar ---- */
.oc{padding:0;overflow:hidden}
.oc-head{display:flex;gap:10px;align-items:flex-start;padding:13px 14px 10px}
.oc-head .head-l{flex:1;min-width:0}
.oc-head .code-row{margin-bottom:5px}
.oc-head .name{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.oc-head .dates{font-size:12.5px;color:var(--soft);margin-top:2px}
.oc-ring{position:relative;width:54px;height:54px;flex:none}
.oc-ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.oc-ring-bg{fill:none;stroke:var(--line);stroke-width:5}
.oc-ring-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s}
.oc-ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.oc-ring-t b{font-size:12.5px;font-weight:800;white-space:nowrap}.oc-ring-t small{font-size:8px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;white-space:nowrap}
.oc-strip{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafbfd}
.oc-strip div{padding:7px 6px;text-align:center;border-right:1px solid var(--line);min-width:0}
.oc-strip div:last-child{border-right:0}
.oc-strip small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
.oc-strip b{font-size:14px;font-weight:800;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-strip b.ok{color:var(--ok)}
.oc-tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.oc-tabs::-webkit-scrollbar{display:none}
.oc-tab{flex:1;min-width:max-content;padding:9px 10px;font-size:12.5px;font-weight:600;color:var(--soft);border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;font-family:inherit;margin-bottom:-1px;white-space:nowrap}
.oc-tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.oc-pane{display:none;padding:8px 14px 6px}
.oc-pane.on{display:block}
.oc-person{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.oc-person:last-child{border-bottom:0}
.oc-av{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.oc-person .n{flex:1;min-width:0}.oc-person .n b{display:block;font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:break-word}.oc-person .n small{color:var(--soft);font-size:12px;display:block}
.oc-person .n a{color:var(--soft);text-decoration:none}
.oc-badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#e7f1fb;color:var(--blue);white-space:nowrap;flex:none}
.oc-badge.lead{background:#e4f3ea;color:var(--ok)}.oc-badge.asst{background:#ede9fe;color:#6e56cf}.oc-badge.guest{background:#fff4e0;color:#b8860b}
.oc-kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 10px;font-size:13px;padding:2px 0 6px;line-height:1.4}
.oc-kv span{color:var(--soft);white-space:nowrap}.oc-kv b{font-weight:500;overflow-wrap:break-word;min-width:0}.oc-kv a{color:var(--ink);text-decoration:none}
.oc-sub{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:8px 0 2px}
.oc-line{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);line-height:1.4}.oc-line:last-child{border-bottom:0}
.oc-line b{font-weight:600}.oc-line small{display:block;color:var(--soft);font-size:12px}.oc-line a{color:inherit;text-decoration:none}
.oc-pane .remarks{margin:6px 0 4px}.oc-pane .fb{margin:6px 0 4px}.oc-pane .sess{margin:4px 0 6px}
.oc-empty{font-size:12.5px;color:var(--soft);padding:6px 0 8px}
.oc-foot{padding:10px 14px 12px;border-top:1px solid var(--line);background:#fafbfd}
.oc-seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:#e9edf3;border-radius:10px;padding:3px;gap:2px}
.oc-seg button{padding:8px 4px;border:0;border-radius:8px;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--soft);cursor:pointer;white-space:nowrap}
.oc-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,40,80,.18)}
.oc-seg button.on.done{color:var(--ok)}.oc-seg button.on.live{color:var(--blue)}
.oc-alt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.oc-alt button{padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
.oc-alt button.on{border-color:#b8860b;color:#b8860b;background:#fff4e0}
.oc .reasonbox{margin:0;padding:0 14px 12px;background:#fafbfd}

/* ==== Duralux skin (matches the console) ==== */
:root{--ink:#283c50;--soft:#58667a;--forest:#3454d1;--blue:#3454d1;--paper:#f0f2f8;--surface:#fff;--line:#e5e7eb;--ok:#0f9a4f;--err:#ea4d4d}

.btn{background:var(--blue)}

.logout-btn{border-radius:4px;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.sess,.pay{border-radius:6px}.sess-h,.pay-h{color:var(--ink);background:#f8f9fb}

</style>

    </div>
  </div>
  <div id="list" style="display:none"></div>
</div>

function dmy(s){if(!s)return "—";if(/^\d{2}\/\d{2}\/\d{4}/.test(s))return s;var d=new Date(s);if(isNaN(d))return s;function p(n){return(n<10?"0":"")+n;}return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();}

/* ===== OFFLINE SUPPORT =====
   The guide app must open and stay usable with no internet: the last
   successful sign-in (guide + assigned ops) is cached, every status change is
   queued locally and flushed to Island Explorer automatically when the
   connection returns, and all of it lives in localStorage so leaving the app
   idle for hours (or the phone discarding the tab) never loses anything. */
var LS_SESSION="ie_gd_session_v1",LS_QUEUE="ie_gd_queue_v1";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
/* Durable backup: IndexedDB survives on several mobile browsers that clear
   localStorage between sessions, so we mirror the session into both and read
   whichever still has it — this is what lets a guide sign in once online and
   keep signing in offline afterwards. */
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open("ie_ops_db",1);r.onupgradeneeded=function(){try{r.result.createObjectStore("kv");}catch(e){}};r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbSet(k,v){return idbOpen().then(function(db){if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}});}
function idbGet(k){return idbOpen().then(function(db){if(!db)return null;return new Promise(function(res){try{var g=db.transaction("kv","readonly").objectStore("kv").get(k);g.onsuccess=function(){res(g.result||null);};g.onerror=function(){res(null);};}catch(e){res(null);}});});}
function idbDel(k){return idbOpen().then(function(db){if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").delete(k);}catch(e){}});}
/* Cache API store — the same storage the service worker uses to make the app
   open offline, so it demonstrably persists on the device even when
   localStorage/IndexedDB get cleared. */
function cacheSet(k,v){try{return caches.open("ie_dur").then(function(c){return c.put("/__dur/"+encodeURIComponent(k),new Response(JSON.stringify(v),{headers:{"content-type":"application/json"}}));}).catch(function(){});}catch(e){return Promise.resolve();}}
function cacheGet(k){try{return caches.open("ie_dur").then(function(c){return c.match("/__dur/"+encodeURIComponent(k));}).then(function(r){return r?r.json():null;}).catch(function(){return null;});}catch(e){return Promise.resolve(null);}}
function cacheDel(k){try{return caches.open("ie_dur").then(function(c){return c.delete("/__dur/"+encodeURIComponent(k));}).catch(function(){});}catch(e){return Promise.resolve();}}
function durSet(k,v){lsSet(k,v);idbSet(k,v);cacheSet(k,v);}
function durDel(k){lsDel(k);idbDel(k);cacheDel(k);}
async function durGet(k){
  var v=lsGet(k);if(v)return v;
  try{v=await idbGet(k);if(v){lsSet(k,v);return v;}}catch(e){}
  try{v=await cacheGet(k);if(v){lsSet(k,v);idbSet(k,v);return v;}}catch(e){}
  return null;
}
/* navigator.onLine lies — many Android browsers report it false while the
   phone clearly has signal. We NEVER block on it: always attempt the network
   and let the actual result decide. _netOk (optimistically true until a
   request truly fails) drives the "offline" banner, not navigator.onLine. */
var _netOk=true;
function isOnline(){return navigator.onLine!==false;}
var syncQueue=lsGet(LS_QUEUE)||[];
function saveSession(){if(myGuide)durSet(LS_SESSION,{phone:myPhone,code:myCode,guide:myGuide,ops:allOps,vehicles:allVehicles,drivers:allDrivers,ws:myWs,savedAt:Date.now()});}
function saveQueue(){lsSet(LS_QUEUE,syncQueue);updateNet();}
function enqueue(rec){syncQueue.push(rec);saveQueue();}
function updateNet(){
  var b=document.getElementById("netbar");if(!b)return;var pend=syncQueue.length,signedIn=!!myGuide;
  if(!_netOk){b.style.display="block";b.style.background="#fff4e0";b.style.color="#7a5a00";b.innerHTML=signedIn?("⚡ Offline — changes are saved on this phone"+(pend?" · "+pend+" waiting to sync":"")+"."):"⚡ Offline — a saved sign-in still works.";return;}
  if(pend){b.style.display="block";b.style.background="#e7f1fb";b.style.color="var(--blue)";b.innerHTML=pend+" change"+(pend>1?"s":"")+" waiting to sync · <span style='cursor:pointer;text-decoration:underline' onclick='syncNow()'>Sync now</span>";return;}
  b.style.display="none";
}
async function flushQueue(){
  ensureSb();
  if(!sb||!syncQueue.length)return;
  var still=[],anyOk=false,anyFail=false;
  for(var i=0;i<syncQueue.length;i++){var rec=syncQueue[i];try{var up=await sb.from("workspaces").insert({id:"sub_"+rec.id,data:rec,updated_at:rec.created_at});if(up&&up.error){still.push(rec);anyFail=true;}else anyOk=true;}catch(e){still.push(rec);anyFail=true;}}
  syncQueue=still;
  if(anyFail)_netOk=false;else if(anyOk)_netOk=true;
  saveQueue();
}
async function syncNow(){await flushQueue();backgroundRefresh();}
function showApp(){
  document.getElementById("gate").style.display="none";
  document.getElementById("logoutBtn").style.display="block";
  document.getElementById("who").textContent=(myGuide&&myGuide.name)?("Operations for "+myGuide.name):("Signed in offline · "+myPhone);
  renderList();updateNet();
}
async function backgroundRefresh(){
  ensureSb();
  if(!sb||!myPhone||!myCode)return;
  await flushQueue();
  try{
    var res=await sb.rpc("guide_login",{p_phone:myPhone,p_code:myCode});
    if(res&&!res.error&&res.data&&!res.data.error){
      _netOk=true;
      myGuide=res.data.guide;allOps=res.data.ops||[];myWs=res.data.workspace||myWs;
      allOps.forEach(function(o){if(o.legs&&o.legs.length)o.legs.sort(function(a,b){if(!a.start)return b.start?1:0;if(!b.start)return -1;return a.start.localeCompare(b.start);});});
      allVehicles=res.data.vehicles||[];allDrivers=res.data.drivers||[];
      saveSession();renderList();updateNet();
    }else if(res&&res.error){_netOk=false;updateNet();}
  }catch(e){_netOk=false;updateNet();}
}
async function offlineRestore(phone,code){
  var s=await durGet(LS_SESSION);
  if(s&&s.guide&&String(s.phone)===String(phone)&&String(s.code)===String(code)){
    myGuide=s.guide;myPhone=phone;myCode=code;allOps=s.ops||[];allVehicles=s.vehicles||[];allDrivers=s.drivers||[];myWs=s.ws||myWs;
    showApp();return true;
  }
  return false;
}

function rpcTimed(name,args,ms){return Promise.race([sb.rpc(name,args),new Promise(function(r){setTimeout(function(){r({error:{message:"timeout — no connection"}});},ms||7000);})]);}

async function doLogin(){
  showErr("");showOk("");
  var phone=normPhone(document.getElementById("gatePhone").value);
  var code=document.getElementById("gateCode").value.trim();
  if(!phone||!code){showErr("Enter your phone number and login code.");return;}
  var btn=document.getElementById("loginBtn");var lbl=btn&&btn.querySelector(".lbl");
  if(btn){btn.disabled=true;btn.classList.add("busy");if(lbl)lbl.textContent="Signing in…";}
  function done(){if(btn){btn.disabled=false;btn.classList.remove("busy");if(lbl)lbl.textContent="View my operations";}}
  function fail(m){done();showErr(m);}
  function failOffline(m){done();showErr(m);showOfflineBtn();}
  /* Always ATTEMPT the real sign-in — never pre-block on navigator.onLine
     (unreliable on Android). Fall back to the cached session only if the
     network request itself fails. */
  ensureSb();
  var OFFLINE_MSG="No internet. Sign in once with internet on this phone and it will work offline after that.";
  /* No signal at all → restore the saved sign-in straight away (no 7-second wait). */
  if(navigator.onLine===false){if(await offlineRestore(phone,code)){done();return;}}
  if(!sb){if(await offlineRestore(phone,code)){done();return;}return failOffline(OFFLINE_MSG);}
  try{
    var res=await rpcTimed("guide_login",{p_phone:phone,p_code:code},7000);
    if(res.error){_netOk=false;if(await offlineRestore(phone,code)){done();return;}
      if(netLikeErr(res.error.message))return failOffline(OFFLINE_MSG);
      return fail("Sign-in service error: "+(res.error.message||"unknown")+".");}
    if(!res.data||res.data.error){_netOk=true;return fail("Phone number or code didn't match.");}
    _netOk=true;
    myGuide=res.data.guide;myPhone=phone;myCode=code;myWs=res.data.workspace||myWs;
    allOps=res.data.ops||[];
    allOps.forEach(function(o){if(o.legs&&o.legs.length)o.legs.sort(function(a,b){if(!a.start)return b.start?1:0;if(!b.start)return -1;return a.start.localeCompare(b.start);});});
    allVehicles=res.data.vehicles||[];allDrivers=res.data.drivers||[];
    done();saveSession();showApp();flushQueue();
    setTimeout(function(){Promise.all([idbGet(LS_SESSION),cacheGet(LS_SESSION)]).then(function(r){var durable=r[0]||r[1];
      if(!(durable||lsGet(LS_SESSION)))showErr("Signed in, but this browser isn't saving data. Install the app to your home screen and sign in there for offline use.");
    });},800);
  }catch(e){_netOk=false;if(await offlineRestore(phone,code)){done();return;}failOffline(OFFLINE_MSG);}
}
/* A "network failure" (offline) vs a genuine backend/setup error. */
function netLikeErr(m){m=String(m||"").toLowerCase();return m.indexOf("fetch")>-1||m.indexOf("network")>-1||m.indexOf("failed to")>-1||m.indexOf("load failed")>-1||m.indexOf("offline")>-1||m.indexOf("timeout")>-1;
}
/* Guaranteed offline sign-in — no prior online sign-in or surviving storage
   needed. Shows any cached operations plus lets the guide report status on
   them; everything queues and syncs when back online. */
async function continueOffline(){
  var phone=normPhone(document.getElementById("gatePhone").value);
  var code=document.getElementById("gateCode").value.trim();
  /* a saved sign-in on this phone comes back with its operations */
  var s=await durGet(LS_SESSION);
  if(s&&s.guide&&(!phone||String(s.phone)===String(phone))){myGuide=s.guide;myPhone=s.phone;myCode=s.code;allOps=s.ops||[];allVehicles=s.vehicles||[];allDrivers=s.drivers||[];_netOk=false;showApp();return;}
  if(!phone){showErr("Enter your phone number first.");return;}
  _netOk=false;myPhone=phone;myCode=code;
  myGuide={name:"",phone:phone,code:code,offline:true};
  allOps=allOps||[];allVehicles=allVehicles||[];allDrivers=allDrivers||[];
  saveSession();
  var ob=document.getElementById("offlineBtn");if(ob)ob.style.display="none";
  showApp();
  showOk("Signed in offline — your operations appear once you're back online.");
}
function doLogout(){
  myGuide=null;myPhone="";myCode="";allOps=[];allVehicles=[];allDrivers=[];
  durDel(LS_SESSION); /* keep the sync queue — unsynced changes must survive logout */
  document.getElementById("gatePhone").value="";document.getElementById("gateCode").value="";
  document.getElementById("gate").style.display="block";
  document.getElementById("logoutBtn").style.display="none";
  var ob=document.getElementById("offlineBtn");if(ob)ob.style.display="none";
  document.getElementById("list").style.display="none";
  document.getElementById("who").textContent="Sign in to see your operations";
  showErr("");showOk("");updateNet();updateDiag();showCtxHint();
}

/* An operation is mine when I'm its guide or one of its additional guides. */
function isMe(n){return String(n||"").trim().toLowerCase()===String(myGuide&&myGuide.name||"").trim().toLowerCase();}
function myEntry(o){if(isMe(o.guide))return {name:o.guide,role:o.guideRole||"Lead",fee:o.guideFee,dates:o.guideDates||[],perDay:o.guidePerDay||0,primary:true};return (o.guides||[]).find(function(x){return isMe(x.name);})||null;}
function myOps(){return allOps.filter(function(o){if(!myEntry(o))return false;if(!o.shadowOf&&allOps.some(function(x){return x.shadowOf===o.id&&isMe(x.guide);}))return false;return true;}).sort(function(a,b){return (a.startISO||"").localeCompare(b.startISO||"");});}
/* Session tours list every working date with the work and the amount allotted. */
/* My dated plan: the session dates I'm allotted (all of them when none were
   ticked), each with the work planned and MY amount for that date — the
   per-date amount typed on the operation for the main guide, else my per-day
   rate; the total is my fee. */
function sessionsHtml(o){
  var all=(o.sessions||[]).filter(function(x){return x&&x.date;});if(!all.length)return "";
  var me=myEntry(o)||{};
  var alloc=all.some(function(x){return x.guides&&x.guides.length;});
  var mineOf=function(x){return alloc?((x.guides||[]).find(function(e){return isMe(e.name);})||null):null;};
  var mine=alloc?all.filter(function(x){return !!mineOf(x);}):((me.dates&&me.dates.length)?all.filter(function(x){return me.dates.indexOf(x.date)>=0;}):all);
  if(!mine.length&&!alloc)mine=all;
  var amt=function(x){var e=mineOf(x);if(e)return parseFloat(e.amount)||0;if(me.primary&&x.amount!==""&&x.amount!=null)return parseFloat(x.amount)||0;if(me.perDay>0)return me.perDay;var f=parseFloat(me.fee)||0;return mine.length?Math.round(f/mine.length):0;};
  var tot=mine.reduce(function(t,x){return t+amt(x);},0);if(!tot&&parseFloat(me.fee)>0)tot=parseFloat(me.fee);
  var esc=function(v){return String(v==null?"":v).replace(/</g,"&lt;");};
  return "<div class='sess'><div class='sess-h'><span>My dates · "+mine.length+(mine.length<all.length?" of "+all.length:"")+"</span>"+(tot>0?"<span>Total "+money(tot)+"</span>":"")+"</div>"+
    mine.map(function(x){var a=amt(x);var e=mineOf(x);var others=(x.guides||[]).filter(function(y){return !isMe(y.name);});
      return "<div class='sess-r'><span class='d'>"+dmy(x.date)+(e&&e.role?"<small>"+esc(e.role)+"</small>":"")+"</span><span class='w'>"+(x.work?esc(x.work):"—")+(others.length?"<small>with "+others.map(function(y){return esc(y.name)+" ("+esc(y.role||"Lead")+")";}).join(", ")+"</small>":"")+"</span><span class='a'>"+(a>0?money(a):"—")+"</span></div>";}).join("")+
  "</div>";
}

/* ---- Payments log: every tour I completed, with my fee and whether Island
   Explorer has marked it paid (set on the console under Logistics → Guide payments). ---- */
function myFeeFor(o){var me=myEntry(o)||{};return parseFloat(me.fee)||0;}
function myPayment(o){var gp=o.guidePayments||{};var k=Object.keys(gp).find(function(n){return isMe(n);});return k?gp[k]:null;}
function renderPayments(subtabs){

  }).join("");
  list.innerHTML=subtabs+"<div class='pay'><div class='pay-h'><span>Completed tours · "+done.length+"</span><span>Paid "+money(paid)+" · Pending "+money(pend)+"</span></div>"+(rows||"<div class='empty' style='padding:22px;font-size:13px'>No completed tours yet.</div>")+"</div>";
}

/* A tour can sleep in more than one place — the guide travels the whole
   tour, so show every stay with its dates. Every stay lives in o.stays now;
   o.stay is only a legacy fallback for old operations. Returns one line per
   stay so the card can list them left-aligned below the label. */
function allStaysLines(o){
  var rows=(o.stays||[]).filter(function(x){return x.stay&&x.stay!=="—";});
  if(!rows.length&&o.stay&&o.stay!=="—")rows=[{stay:o.stay}];
  return rows.map(function(x){
    var extra=[];if(x.rooms!=null&&x.rooms!=="")extra.push(x.rooms+" room"+(x.rooms==1?"":"s"));if(x.note)extra.push(x.note);
    return x.stay+((x.start||x.end)?" ("+dmy(x.start)+" – "+dmy(x.end)+")":"")+(extra.length?" — "+extra.join(" · "):"");
  });
}
/* Read-only breakdown of a multi-leg tour's vehicle/driver changes (e.g. one
   pair in South Andaman, a different pair once the group reaches Great
   Nicobar) — nothing to show for the common single-driver-for-the-whole-tour
   case. */
function opLegRows(o){
  if(!o.legs||!o.legs.length)return [];
  var rows=[{start:o.startISO||o.start,end:o.legs[0].start,veh:o.veh,reg:o.reg,driver:o.driver,driverPhone:o.driverPhone,driverStatus:o.driverStatus}].concat(o.legs);
  return rows.filter(function(l,i){return !(i===0&&l.start&&l.end&&_isoOf(l.end)<=_isoOf(l.start));}); /* legs start on day one: no separate first stretch */
}
function opLegsSummaryHtml(o){

    rows.map(function(l,i){return "<span class='v' style='text-align:left;font-weight:500;margin-top:2px'>Leg "+(i+1)+" ("+(dmy(l.start))+" – "+(dmy(l.end))+"): "+(l.veh||"—")+(l.reg?" · "+l.reg:"")+" — "+(l.driver||"—")+(l.driverPhone?" · "+l.driverPhone:"")+(l.driverStatus?" <span style='color:#b8860b'>· driver: "+l.driverStatus+"</span>":"")+"</span>";}).join("")+
  "</div>";
}
/* ---- Ops-sheet card helpers ---- */
function _esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function _isoOf(d){d=String(d||"");var m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+"-"+m[2]+"-"+m[1]:d.slice(0,10);}
function _days(a,b){a=new Date(_isoOf(a));b=new Date(_isoOf(b));if(isNaN(a)||isNaN(b))return null;return Math.round((b-a)/864e5);}
function _ini(n){n=String(n||"").trim().split(/\s+/);return (((n[0]||"")[0]||"")+((n[1]||"")[0]||"")).toUpperCase()||"?";}
function _hue(n){var h=0;n=String(n||"");for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h;}
function ocAvatar(n){return "<span class='oc-av' style='background:hsl("+_hue(n)+" 48% 42%)'>"+_ini(n)+"</span>";}
function ocTel(p){p=String(p||"").trim();if(!p)return "";return "<a href='tel:"+_esc(normPhone(p))+"'>"+_esc(p)+"</a>";}
/* Countdown ring: days to go before the tour, day N of M while it runs, a tick when done. */
function ocRingHtml(o){
  var today=new Date();today=new Date(today.getTime()-today.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  var s=_isoOf(o.startISO||o.start),e=_isoOf(o.endISO||o.end)||s,st=o.status||"Scheduled";
  var big="",small="",frac=0,col="var(--blue)";
  if(st==="Completed"){big="\u2713";small="done";frac=1;col="var(--ok)";}
  else if(st==="Declined"||st==="Transferred"){big="\u2014";small=st==="Declined"?"declined":"moved";frac=0;col="#b8860b";}
  else if(!s||isNaN(new Date(s))){big="?";small="dates";}
  else if(today<s){var n=_days(today,s);big=n+"d";small="to go";frac=Math.max(.06,1-Math.min(n,30)/30);}
  else if(today>e){big="end";small="ended";frac=1;col="#b8860b";}
  else{var tot=Math.max(1,_days(s,e)+1),dn=Math.min(tot,_days(s,today)+1);big=dn+"/"+tot;small="day";frac=dn/tot;col="var(--ok)";}
  var r=22,c=(2*Math.PI*r).toFixed(1);
  return "<div class='oc-ring' title='"+_esc(small)+"'><svg viewBox='0 0 52 52' aria-hidden='true'><circle cx='26' cy='26' r='"+r+"' class='oc-ring-bg'/><circle cx='26' cy='26' r='"+r+"' class='oc-ring-fg' style='stroke:"+col+";stroke-dasharray:"+c+";stroke-dashoffset:"+(c*(1-frac)).toFixed(1)+"'/></svg><div class='oc-ring-t'><b>"+big+"</b><small>"+small+"</small></div></div>";
}
var _cardTab={};
function ocTab(id,t){_cardTab[id]=t;var c=document.getElementById("card_"+id);if(!c)return;c.querySelectorAll(".oc-tab").forEach(function(b){b.classList.toggle("on",b.dataset.t===t);});c.querySelectorAll(".oc-pane").forEach(function(p){p.classList.toggle("on",p.dataset.t===t);});}
/* Everyone on the tour: guides by role (me marked), then the point of contact. */
function ocPeople(o,me){
  var all=[{name:o.guide,role:o.guideRole||"Lead"}].concat(o.guides||[]).filter(function(x){return x&&x.name&&x.name!=="\u2014";});
  var seen={};all=all.filter(function(x){var k=String(x.name).trim().toLowerCase();if(seen[k])return false;seen[k]=1;return true;});
  if(me.role){all.forEach(function(x){if(isMe(x.name))x.role=me.role;});}
  var gc=function(n){try{return (typeof guideContact==="function"?guideContact(n):null)||{};}catch(e){return {};}};
  var rows=all.map(function(x){var a=/assist/i.test(x.role||"");var c=gc(x.name);var ph=x.phone||c.phone||"";
    return "<div class='oc-person'>"+ocAvatar(x.name)+"<div class='n'><b>"+_esc(x.name)+(isMe(x.name)?" <span style='color:var(--blue)'>(you)</span>":"")+"</b>"+(ph?"<small>"+ocTel(ph)+"</small>":"")+"</div><span class='oc-badge "+(a?"asst":"lead")+"'>"+(a?"Assistant":"Lead guide")+"</span></div>";});
  if(o.pocName)rows.push("<div class='oc-person'>"+ocAvatar(o.pocName)+"<div class='n'><b>"+_esc(o.pocName)+"</b>"+(o.pocPhone?"<small>POC \u00b7 "+ocTel(o.pocPhone)+"</small>":"<small>Point of contact</small>")+"</div><span class='oc-badge guest'>Guest</span></div>");
  return rows.join("");
}

function renderList(){
  var list=document.getElementById("list");list.style.display="block";
  var mine=myOps();
  var subtabs="<div class='tabs'>"+OP_FILTERS.map(function(f){return "<button class='tab "+(f===_opFilter?"on":"")+"' onclick=\"setOpFilter('"+f+"')\">"+f+"</button>";}).join("")+"</div>";
  if(_opFilter==="Payments")return renderPayments(subtabs);
  if(!mine.length){list.innerHTML=subtabs+"<div class='empty'>No operations assigned to you yet.</div>";return;}
  var shown=mine.filter(function(o){return opMatchesFilter(o,_opFilter);});
  list.innerHTML=subtabs+(shown.length?shown.map(function(o){
    var v=allVehicles.find(function(x){return x.name===o.veh;})||{};
    var d=allDrivers.find(function(x){return x.name===o.driver;})||{};
    var me=myEntry(o)||{};
    var fee=(me.fee!=null&&me.fee!=="")?money(me.fee):"";
    var sess=(o.sessions||[]).filter(function(x){return x&&x.date;});
    var myDates=(me.dates&&me.dates.length)?sess.filter(function(x){return me.dates.indexOf(x.date)>=0;}):sess;if(!myDates.length)myDates=sess;
    var dateLine=(o.opType==="session"&&myDates.length)?myDates.slice().sort(function(a,b){return _isoOf(a.date).localeCompare(_isoOf(b.date));}).map(function(x){return dmy(x.date);}).join(" · "):(dmy(o.startISO||o.start)+(o.endISO||o.end?" – "+dmy(o.endISO||o.end):""));
    var kv=function(k,v){return v?"<span>"+k+"</span><b>"+v+"</b>":"";};
    var tab=_cardTab[o.id]||"team";
    var nights=(o.opType==="session")?null:_days(o.startISO||o.start,o.endISO||o.end);
    var typeTxt=o.opType==="session"?"Session tour":(o.opType==="mixed"?"Mixed tour":"Group tour");
    /* transport pane */
    var legs=opLegRows(o);
    var trans="<div class='oc-kv'>"+kv("Vehicle",_esc(o.veh)+((v.reg||o.reg)?" \u00b7 "+_esc(v.reg||o.reg):""))+kv("Driver",_esc(o.driver)+((d.phone||o.driverPhone)?" \u00b7 "+ocTel(d.phone||o.driverPhone):""))+
      kv("Pickup",(o.pickupDate?dmy(o.pickupDate):"")+((o.pickupLoc||o.pickup)?(o.pickupDate?" \u00b7 ":"")+_esc(o.pickupLoc||o.pickup):""))+kv("Drop",(o.dropDate?dmy(o.dropDate):"")+(o.dropLoc?(o.dropDate?" \u00b7 ":"")+_esc(o.dropLoc):""))+"</div>"+
      (legs.length?"<div class='oc-sub'>Legs</div>"+legs.map(function(l,i){return "<div class='oc-line'><b>Leg "+(i+1)+" \u00b7 "+dmy(l.start)+" \u2013 "+dmy(l.end)+"</b><small>"+_esc(l.veh||"\u2014")+(l.reg?" \u00b7 "+_esc(l.reg):"")+" \u00b7 "+_esc(l.driver||"\u2014")+(l.driverPhone?" \u00b7 "+ocTel(l.driverPhone):"")+(l.driverStatus?" <span style='color:#b8860b'>\u00b7 driver: "+_esc(l.driverStatus)+"</span>":"")+"</small></div>";}).join(""):"");
    if(!o.veh&&!o.driver&&!legs.length&&!o.pickupLoc&&!o.pickup&&!o.dropLoc)trans="<div class='oc-empty'>No transport details yet.</div>";
    /* stays pane */
    var stayLines=allStaysLines(o);
    var stays=stayLines.length?stayLines.map(function(t){return "<div class='oc-line'>"+_esc(t)+"</div>";}).join(""):"";
    /* notes pane: remarks, itinerary, my note */
    var notes=(o.remarks?"<div class='remarks'><b>Remarks:</b> "+_esc(o.remarks)+"</div>":"")+
      ((o.itinerary&&o.itinerary.length)?"<div class='remarks'><b>Itinerary</b>"+o.itinerary.map(function(dd){return "<div style='margin-top:6px'><b>Day "+dd.day+(dd.date?" \u00b7 "+dmy(dd.date):"")+"</b>"+(dd.title?" \u2014 "+_esc(dd.title):"")+(dd.plan?"<div style='opacity:.85;margin-top:2px;line-height:1.45'>"+_esc(dd.plan).replace(/\n/g,'<br>')+"</div>":"")+"</div>";}).join("")+"</div>":"")+
      (o.guideFeedback?"<div class='fb'><b>Your note ("+dmy(o.guideFeedbackAt)+"):</b> "+_esc(o.guideFeedback)+"</div>":"");
    var sessHtml=sessionsHtml(o);
    var panes=[["team","Team",ocPeople(o,me)],["transport","Transport",trans]];
    if(stays)panes.push(["stays","Stays",stays]);
    if(sessHtml)panes.push(["dates","My dates",sessHtml]);
    if(notes)panes.push(["notes","Notes",notes]);
    if(!panes.some(function(p){return p[0]===tab;}))tab="team";
    var st=o.status||"Scheduled";
    return "<div class='card oc' id='card_"+o.id+"'><div class='oc-head'><div class='head-l'><div class='code-row'>"+(o.tourId?"<span class='code'>"+_esc(o.tourId)+"</span>":"")+"<span class='pill "+pillClass(o.status)+"' id='statuspill_"+o.id+"'>"+_esc(st)+"</span></div>"+
      "<div class='name'>"+_esc(o.tour||"Tour")+"</div><div class='dates'>"+dateLine+" \u00b7 "+typeTxt+"</div></div>"+ocRingHtml(o)+"</div>"+
      "<div class='oc-strip'><div><small>Your fee</small><b class='ok'>"+(fee||"\u2014")+"</b></div><div><small>"+(o.opType==="session"?"My dates":"Nights")+"</small><b>"+(o.opType==="session"?myDates.length:(nights!=null?nights:"\u2014"))+"</b></div><div><small>Pax</small><b>"+_esc(o.pax||"\u2014")+"</b></div></div>"+
      "<div class='oc-tabs'>"+panes.map(function(p){return "<button class='oc-tab "+(p[0]===tab?"on":"")+"' data-t='"+p[0]+"' onclick=\"ocTab('"+o.id+"','"+p[0]+"')\">"+p[1]+"</button>";}).join("")+"</div>"+
      panes.map(function(p){return "<div class='oc-pane "+(p[0]===tab?"on":"")+"' data-t='"+p[0]+"'>"+p[2]+"</div>";}).join("")+
      "<div class='oc-foot' id='acts_"+o.id+"'>"+
        "<div class='oc-seg'>"+
          "<button class='"+(st==='Scheduled'?'on':'')+"' onclick=\"setOpStatus('"+o.id+"','Scheduled')\">Scheduled</button>"+
          "<button class='"+(st==='In progress'?'on live':'')+"' onclick=\"setOpStatus('"+o.id+"','In progress')\">In progress</button>"+
          "<button class='"+(st==='Completed'?'on done':'')+"' onclick=\"setOpStatus('"+o.id+"','Completed')\">Completed</button>"+
        "</div>"+
        "<div class='oc-alt'>"+
          "<button class='"+(st==='Declined'?'on':'')+"' onclick=\"toggleReason('"+o.id+"','Declined')\">Decline</button>"+
          "<button class='"+(st==='Transferred'?'on':'')+"' onclick=\"toggleReason('"+o.id+"','Transferred')\">Transfer</button>"+
        "</div>"+
      "</div>"+
      "<div class='reasonbox' id='reason_"+o.id+"'><label>Reason / feedback</label><textarea id='reasontext_"+o.id+"' placeholder='Let Island Explorer know why\u2026'></textarea><button onclick=\"submitReason('"+o.id+"')\">Submit</button></div>"+
    "</div>";
  }).join(""):"<div class='empty'>No operations in this view.</div>");
}
function setBusy(opId,busy,label){
  var box=document.getElementById("acts_"+opId);if(!box)return;
  box.querySelectorAll("button").forEach(function(b){b.disabled=busy;b.style.opacity=busy?"0.5":"1";});
  if(busy&&label){var p=document.getElementById("statuspill_"+opId);if(p)p.textContent=label;}
}
function toggleReason(opId,status){
  document.querySelectorAll(".reasonbox").forEach(function(b){if(b.id!=="reason_"+opId)b.style.display="none";});
  var box=document.getElementById("reason_"+opId);
  box.dataset.status=status;
  box.style.display=(box.style.display==="block")?"none":"block";
}
async function submitReason(opId){
  var box=document.getElementById("reason_"+opId);
  var text=document.getElementById("reasontext_"+opId).value.trim();
  if(!text){alert("Please add a short reason before submitting.");return;}
  await postStatus(opId,box.dataset.status,text);
}
async function setOpStatus(opId,status){var o=allOps.find(function(x){return x.id===opId;});if(o&&(o.status||"Scheduled")===status)return;await postStatus(opId,status,"");}
async function postStatus(opId,status,reason){
  showErr("");
  /* workspace matches the guide_login RPC, which serves the island-explorer data */
  var rec={id:"S"+Date.now()+Math.floor(Math.random()*100000),type:"op_status_update",status:"new",name:myGuide.name,created_at:new Date().toISOString(),workspace:myWs||"island-explorer",
    data:{opId:opId,newStatus:status,reason:reason,guide:myGuide.name}};
  /* Apply locally first (instant + offline-safe), then queue — flushed now if
     online, later if not. */
  var o=allOps.find(function(x){return x.id===opId;});
  if(o){o.status=status;if(reason){o.guideFeedback=reason;o.guideFeedbackAt=rec.created_at;}}
  enqueue(rec);saveSession();renderList();
  await flushQueue();updateNet();
}
</script>
